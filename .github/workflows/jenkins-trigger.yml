name: Trigger Jenkins Job

on:
  push:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:

jobs:
  trigger-job:
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name and build Jenkins URL
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          JENKINS_URL="https://automation.prms.cgiar.org/job/ibd-landing-page-${BRANCH_NAME}/build"
          echo "Branch: $BRANCH_NAME"
          echo "Jenkins job URL: $JENKINS_URL"
          echo "JENKINS_URL=${JENKINS_URL}" >> "$GITHUB_ENV"

      - name: Trigger Jenkins Job
        run: |
          curl -X POST "${JENKINS_URL}" \
            --user "${JENKINS_USERNAME}:${JENKINS_API_TOKEN}"
        env:
          JENKINS_URL: ${{ env.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
